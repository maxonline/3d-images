<!DOCTYPE html>
<!--
  Source for web/og-image.png, the 1200×630 link-preview image (Open Graph /
  Twitter card) shown when the site is shared on Reddit, Discord, etc.
  Not deployed — regenerate the PNG by screenshotting this page at exactly
  1200×630 (e.g. Playwright: viewport 1200×630, page.screenshot()).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(96,165,250,0.18), transparent 60%),
      radial-gradient(700px 400px at 10% 110%, rgba(249,115,22,0.12), transparent 60%),
      #000;
    color: #f0f0f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    padding: 0 72px;
    gap: 56px;
  }
  .text { flex: 1 1 0; }
  .eyebrow {
    font-size: 22px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #60a5fa; margin-bottom: 18px;
  }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
  h1 .w { display: inline-block; position: relative; }
  h1 .w::before, h1 .w::after {
    content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1;
  }
  h1 .w::before { color: #ef4444; transform: translateX(-5px); opacity: .85; }
  h1 .w::after  { color: #22d3ee; transform: translateX(5px);  opacity: .85; }
  p.tag { margin-top: 24px; font-size: 29px; line-height: 1.35; color: #c8c8c8; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 21px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    border: 1.5px solid #3a3a3a; color: #e5e5e5; background: rgba(255,255,255,0.04);
  }
  .chip.accent { border-color: #60a5fa; color: #93c5fd; }
  .art { flex: 0 0 470px; position: relative; height: 470px; }
  .card {
    position: absolute; width: 400px; height: 400px; border-radius: 22px; overflow: hidden;
    border: 2px solid #3a3a3a; box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }
  .card.back1 { left: 0; top: 0; transform: rotate(-7deg); opacity: .5; }
  .card.back2 { left: 34px; top: 22px; transform: rotate(-2deg); opacity: .75; }
  .card.front { left: 70px; top: 48px; transform: rotate(4deg); border-color: #60a5fa; }
  .badge {
    position: absolute; right: 10px; bottom: 6px; z-index: 5;
    font-size: 20px; font-weight: 700; padding: 8px 14px; border-radius: 10px;
    background: #60a5fa; color: #000; transform: rotate(4deg);
  }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">Free · in your browser</div>
    <h1><span class="w" data-t="Wigglegram">Wigglegram</span><br>Maker</h1>
    <p class="tag">Turn 3D camera .MPO photos or 2–10 burst shots into wiggling, depth-faking animations.</p>
    <div class="chips">
      <span class="chip accent">GIF</span>
      <span class="chip accent">WebP</span>
      <span class="chip accent">MP4</span>
      <span class="chip">Align &amp; crop</span>
      <span class="chip">Optical-flow tweening</span>
    </div>
  </div>

  <div class="art">
    <!-- Three "frames" of the same scene: far hills barely move, the
         foreground lighthouse shifts a lot — that parallax is the effect. -->
    <template id="scene">
      <svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e1b4b"/>
            <stop offset="0.55" stop-color="#7c3aed"/>
            <stop offset="1" stop-color="#f97316"/>
          </linearGradient>
        </defs>
        <rect width="400" height="400" fill="url(#sky)"/>
        <circle cx="270" cy="235" r="62" fill="#fde68a" opacity="0.95"/>
        <g class="far"><path d="M-20 290 L60 220 L130 270 L210 200 L300 265 L360 225 L430 280 L430 400 L-20 400Z" fill="#4c1d95"/></g>
        <g class="mid"><path d="M-20 320 Q90 270 190 315 T430 305 L430 400 L-20 400Z" fill="#2e1065"/></g>
        <g class="near">
          <rect x="88" y="150" width="46" height="200" rx="6" fill="#f8fafc"/>
          <rect x="88" y="195" width="46" height="22" fill="#ef4444"/>
          <rect x="88" y="255" width="46" height="22" fill="#ef4444"/>
          <rect x="80" y="128" width="62" height="26" rx="4" fill="#0f172a"/>
          <rect x="94" y="104" width="34" height="26" rx="3" fill="#fde047"/>
          <path d="M84 104 L111 78 L138 104Z" fill="#0f172a"/>
          <rect x="-20" y="340" width="440" height="80" fill="#0b0720"/>
        </g>
      </svg>
    </template>
    <div class="card back1" data-near="-26" data-mid="-8" data-far="-3"></div>
    <div class="card back2" data-near="-13" data-mid="-4" data-far="-1.5"></div>
    <div class="card front" data-near="0" data-mid="0" data-far="0"></div>
    <div class="badge">1 → 2 → 3 → 2 ↺</div>
  </div>

  <script>
    const tpl = document.getElementById('scene');
    document.querySelectorAll('.card').forEach((card) => {
      const svg = tpl.content.firstElementChild.cloneNode(true);
      for (const layer of ['near', 'mid', 'far']) {
        svg.querySelector('.' + layer).setAttribute('transform', `translate(${card.dataset[layer]} 0)`);
      }
      card.appendChild(svg);
    });
  </script>
</body>
</html>
